name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  # Disposable values used only inside this CI run - never real secrets.
  # `prisma generate` (npm ci's postinstall) needs DATABASE_URL to be
  # *defined*, even in jobs that never actually connect to a database.
  AUTH_SECRET: ci-only-throwaway-secret-not-used-anywhere-real
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/unused

jobs:
  verify:
    name: Lint, typecheck, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - run: npm ci

      - run: npm run lint

      - run: npx tsc --noEmit

      - run: npm run test

  build-and-e2e:
    name: Build + end-to-end tests
    needs: verify
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: artisanat_marketplace_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/artisanat_marketplace_ci
      AUTH_URL: http://localhost:3000
      AUTH_TRUST_HOST: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - run: npm ci

      # Validates the migrations apply cleanly to a fresh database, before
      # they ever reach the real one.
      - run: npx prisma generate
      - run: npx prisma migrate deploy

      # Compile + type-check + bundle the production build. Every route in
      # this app is server-rendered on demand (no static generation touches
      # the database), so this step needs no further DB access.
      - run: npx next build

      - run: npx playwright install --with-deps chromium

      - run: npx tsx prisma/seed-test.ts

      - run: npm run test:e2e
        env:
          CI: true

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  deploy:
    name: Deploy to Vercel (production)
    needs: [verify, build-and-e2e]
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - run: npm install --global vercel@latest

      # Vercel's remote build runs `npm run build` (prisma generate + migrate
      # deploy against the real DB + next build) using the env vars already
      # configured in the Vercel dashboard - no secrets needed here besides
      # the deploy token itself.
      #
      # Retries because of a known transient issue: `prisma migrate deploy`
      # occasionally times out acquiring a Postgres advisory lock on this
      # project's pooled Neon connection (P1002). It has always cleared
      # within a couple of minutes in past manual retries; production is
      # never affected either way since Vercel keeps serving the last
      # successful deployment throughout.
      - name: Deploy (retries on transient advisory-lock timeout)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
        run: |
          for attempt in 1 2 3 4 5; do
            echo "::group::Deploy attempt $attempt/5"
            if vercel deploy --prod --yes --token="$VERCEL_TOKEN"; then
              echo "::endgroup::"
              echo "Deploy succeeded on attempt $attempt."
              exit 0
            fi
            echo "::endgroup::"
            if [ "$attempt" -lt 5 ]; then
              echo "Deploy failed, waiting 90s before retry..."
              sleep 90
            fi
          done
          echo "All 5 deploy attempts failed."
          exit 1
